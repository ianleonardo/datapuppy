# Docker settings for scripts/docker-build|start|stop (.sh and .cmd).
# Copy this file to docker/docker.conf and edit. Format: KEY=VALUE, one per line, no quotes, no inline comments.
# Environment variables with the same name override this file; command-line options override both.
# Relative paths are relative to the project folder.

# Image name; the build tags <IMAGE_NAME>:<build stamp> and <IMAGE_NAME>:latest
IMAGE_NAME=sqlassist
CONTAINER_NAME=sqlassist

# Where image files (.tar.gz / .tar) are written by the build and looked for by the start script.
# Copy a new image file here and run the start script: it loads the file if it is newer than the image in Docker.
IMAGE_DIR=docker/images
# How many image files the build keeps in IMAGE_DIR (older ones are deleted)
KEEP_IMAGES=3

# Folder with the app data (DuckDB store, uploads, exports, logs, backups). Mounted read-write at /data.
DATA_DIR=data
# Folder with sqlassist.toml, master.key and TLS files. Mounted at /app/config. Must be writable on first start.
# In sqlassist.toml, refer to cert/key files as ./config/<file>.
CONFIG_DIR=config

# Published port. HOST_BIND=127.0.0.1 keeps it on this machine; 0.0.0.0 serves the network (configure TLS first).
HOST_BIND=127.0.0.1
HOST_PORT=8080

# User the container runs as. auto = your own uid:gid on Linux/macOS (files in DATA_DIR stay owned by you),
# root = no --user flag, or an explicit uid:gid such as 1001:1001.
RUN_AS=auto

# Time zone inside the container (used for backup schedules and log display), e.g. Asia/Singapore
TZ=Asia/Singapore

# Build options: base image, optional DB drivers (oracledb, mariadb), private PyPI mirror
BASE_IMAGE=python:3.12-slim-bookworm
DRIVERS=oracledb
PIP_INDEX_URL=
# Network for build steps (apt/pip). Set to host when your proxy listens on 127.0.0.1 (cntlm, px); empty = default
BUILD_NETWORK=
